name: Release

# Pushing a tag like v0.2.0 builds, tests and packages the portable zip and attaches it to a DRAFT
# GitHub release. Review the draft and publish it manually.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --solution CaptionOverlay.slnx -c Release
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ github.ref_name }}"
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem artifacts/CaptionOverlay-*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName artifacts/SHA256SUMS.txt `
            --draft --title "CaptionOverlay ${{ github.ref_name }}" `
            --notes "Portable build for Windows 10/11 x64. Extract and run CaptionOverlay.exe. Unsigned: SmartScreen may warn (More info -> Run anyway). Verify with SHA256SUMS.txt."
